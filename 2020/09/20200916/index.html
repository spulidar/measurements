<!doctype html>
<html lang="en">
<head>

  <style>
    :root { --top:#1a1a1a; --page:#f0f2f5; --panel:#fff; --text:#333; --muted:#777; --blue:#0056b3; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--page); color:var(--text); font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    body { min-height:100vh; display:flex; flex-direction:column; }
    .top-bar { background:var(--top); color:white; padding:10px 24px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; box-shadow:0 2px 4px rgba(0,0,0,.2); }
    .top-bar h2 { margin:0; font-size:18px; font-weight:500; letter-spacing:1px; }
    .date { color:#4fc3f7; font-weight:700; }
    .metadata { color:#aaa; font:12px monospace; display:flex; gap:15px; flex-wrap:wrap; }
    .toolbar { position:sticky; top:0; z-index:10; background:var(--panel); border-bottom:1px solid #ddd; padding:8px 20px; display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:18px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .control-group { display:flex; align-items:center; justify-content:center; gap:7px; flex-wrap:wrap; }

    .main-mode-btn { border:0; border-bottom:3px solid transparent; background:transparent; padding:7px 10px; color:var(--muted); font-weight:650; cursor:pointer; }
    .main-mode-btn.active { color:var(--blue); border-bottom-color:var(--blue); }
    .tab-btn { border:1px solid #ccc; border-radius:4px; background:#f8f9fa; color:#555; padding:6px 10px; min-height:31px; font:600 12px monospace; cursor:pointer; }
    .tab-btn:hover { background:#e2e6ea; color:#111; }
    .tab-btn.active { background:#546e7a; border-color:#37474f; color:#fff; }
    .period-btn.active { background:var(--blue); border-color:#004085; }
    .ch-btn.active { background:#2e7d32; border-color:#1b5e20; }
    .image-container { padding:15px; text-align:center; min-height:calc(100vh - 150px); flex:1; display:flex; justify-content:center; align-items:center; }
    #main-display { max-width:100%; max-height:calc(100vh - 180px); object-fit:contain; background:#fff; box-shadow:0 6px 16px rgba(0,0,0,.15); cursor:zoom-in; }
    .message { display:none; max-width:720px; background:#fff; border:1px solid #ddd; border-radius:8px; padding:20px; line-height:1.5; box-shadow:0 4px 12px rgba(0,0,0,.08); }
    .message.active { display:block; }
    #myModal { display:none; position:fixed; z-index:1000; inset:0; background:rgba(0,0,0,.9); }
    .modal-close { position:absolute; top:15px; right:30px; color:#bbb; font-size:40px; cursor:pointer; }
    .modal-content { display:block; margin:2vh auto 0; max-width:98%; max-height:95vh; }
    @media (max-width:700px) {
      .top-bar { justify-content:center; text-align:center; padding:10px 12px; }
      .metadata { width:100%; justify-content:center; font-size:10px; }
      .toolbar { position:static; padding:10px 8px; gap:10px; }
      .control-group { width:100%; }
      .control-group h3 { width:100%; text-align:center; margin:3px 0; }
      .tab-btn { flex:1 1 74px; min-height:38px; }
      .image-container { align-items:flex-start; padding:10px 8px 18px; min-height:auto; }
      #main-display { width:100%; max-height:none; height:auto; }
    }

<body>
  <div class="top-bar">

  </div>

  <div class="toolbar">
    <div class="control-group" id="period-controls"><h3>Publication window</h3></div>
    <div class="control-group">

    </div>
    <div class="control-group" id="channel-controls"><h3>Wavelength</h3></div>
    <div class="control-group" id="altitude-controls"><h3>Range</h3></div>
  </div>

  <div class="image-container">
    <img id="main-display" alt="Lidar publication view" onclick="openModal(this.src)">
    <div id="message" class="message"></div>
  </div>

  <div id="myModal"><span class="modal-close" onclick="closeModal()">&times;</span><img class="modal-content" id="img01" alt="Expanded lidar image"></div>

<script>
const dayData = {"date": "20200916", "publication_views": [{"selector_id": "06", "publication_window_id": "20200916_spu_06", "label": "06–12", "channels": {"1064nm_AN": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_06_1064nm_AN_15km.webp?v=57e627138b3d5e79491cb396d71c1847f3c6fed023bfb01e1badcab38d8329ad", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_06_1064nm_AN_30km.webp?v=7d72b5f2c5aca5d7a4a19578d4f12da3e1b9e4aadedb7470544e642130618baf", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_06_1064nm_AN_5km.webp?v=600e32fad2d37c8a447995b1b10fe22d7227566b3ccacc74fc34620c097ebcdd"}, "355nm_AN": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_06_355nm_AN_15km.webp?v=d4d316757081b3394aa48f339f8d7775599079d990d20c1a024dfd697d93d24c", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_06_355nm_AN_30km.webp?v=d46c1cef6be931fda9ba71f3becffc9b77fbec6eca1895e76dc583664377cdc5", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_06_355nm_AN_5km.webp?v=dbed0fc8cbc640f39352e443dde1ffaa83bcf84f9b52abccd26bbaaf95e0d956"}, "355nm_PC": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_06_355nm_PC_15km.webp?v=aec01d6fb35ee57c2d9254f32ab6a77740ed9502bb863f5a2d881990ce4c08c3", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_06_355nm_PC_30km.webp?v=7d3e827ed195bef27c82cca8b9ffe4ddd9fec0db628610c946a8ecd6d1fdce15", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_06_355nm_PC_5km.webp?v=528d4d95ad7d475082c42c9462a6dd919fb719424a98d670ced716cdd91a45f5"}, "532nm_AN": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_06_532nm_AN_15km.webp?v=c9406d064bc1c4d0d677cd2b04f3480ffa73830453b6480ba565d238b3966d58", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_06_532nm_AN_30km.webp?v=6419dbd5013dab821d0eda333b727f21bdc2a422382769abadfe47cf0a05ca57", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_06_532nm_AN_5km.webp?v=827d382f064c33266eb8ae8b7f0b91605994b425e644d517fd9f849842d91723"}, "532nm_PC": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_06_532nm_PC_15km.webp?v=f968b664a98c912fe9cc4b0e9d62aee59834a0a80ed7813a37f14f0ce6fc8f7d", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_06_532nm_PC_30km.webp?v=1f2990959ae0bcb6e71b7735ebdec1a82e50223a25cdd864239c0f08ecb60f56", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_06_532nm_PC_5km.webp?v=a213e714a1315d2f2e8f05651cb1c17464434dae8faaa695e7a75e51843f967f"}}}, {"selector_id": "12", "publication_window_id": "20200916_spu_12", "label": "12–18", "channels": {"1064nm_AN": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_12_1064nm_AN_15km.webp?v=71e32bedd6fd5d59ee44d0a00220dfe84faa93da3f00fb5445076f82409496ea", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_12_1064nm_AN_30km.webp?v=a54c5d327888b2236990c7338900e72401867ad6133a9544e0d148a733af78cd", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_12_1064nm_AN_5km.webp?v=cbb97ff38e2af4bd5d8c432cc91ad415b5d176e53de0a690dd460a518b360831"}, "355nm_AN": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_12_355nm_AN_15km.webp?v=15ad41dc3c171d82205666127efa2a8dcc06d98762e2a50c143604d734626993", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_12_355nm_AN_30km.webp?v=4ba35c1a58954d27442fdf630b5217e4ecd99a6dd54164c73d5e0fbdb63ce807", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_12_355nm_AN_5km.webp?v=17ffc59f60b411251503b25edbd3f5afe51e13077eab92df6341eb7395babb48"}, "355nm_PC": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_12_355nm_PC_15km.webp?v=8e9f64a189779ae28a4608eb48e27e17a3073537fde81de9eb7730c77c50e3d5", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_12_355nm_PC_30km.webp?v=fa13f0380f9ed6a74da86365f0b35ce0c635dd1024784b431dd20eb89fc58612", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_12_355nm_PC_5km.webp?v=70f17e3ba5c1ad134a2195b94811a4f067fb6a148e0118952b3251d90ee6586b"}, "532nm_AN": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_12_532nm_AN_15km.webp?v=9a45da4f03983bd1e5a9b10a3d7ee41800a8bb76805ec5bf7f25554023801d32", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_12_532nm_AN_30km.webp?v=1aea9c1ecd3a89f9125c334de1a8bafdbad96329d045f12a5db70e1f18aeb0b0", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_12_532nm_AN_5km.webp?v=8d7fc59e1a06a9ecf1637bfc6ddf1f107957e6184eee3579a5feef7b13e7ebe8"}, "532nm_PC": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_12_532nm_PC_15km.webp?v=baf203bcef688258ccb02d0093640b1d2284d9d3219223e9f897d0f78a840aa9", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_12_532nm_PC_30km.webp?v=747f05b9d07260ffaccea64a141b90d1bc37523888650edf2a2f5de310aa3b42", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/09/20200916/rcs_20200916_spu_12_532nm_PC_5km.webp?v=7d8a26fe722720824ed8580f0433ea9ddf8e7b8482b10ec56258b119f0bda6e0"}}}]};
let currentSelectorId = dayData.publication_views.length ? dayData.publication_views[0].selector_id : '';
let currentChannel = '';
let currentAltitude = '';

const img = document.getElementById('main-display');
const message = document.getElementById('message');
const channelControls = document.getElementById('channel-controls');
const altitudeControls = document.getElementById('altitude-controls');

function clearButtons(container) { container.querySelectorAll('button').forEach(button => button.remove()); }
function currentView() { return dayData.publication_views.find(view => view.selector_id === currentSelectorId) || null; }
function showMessage(text) { img.style.display='none'; message.textContent=text; message.classList.add('active'); }
function hideMessage() { message.classList.remove('active'); message.textContent=''; img.style.display='block'; }

function renderWindows() {
  const container=document.getElementById('period-controls');
  clearButtons(container);
  dayData.publication_views.forEach(view => {
    const btn=document.createElement('button');
    btn.className='tab-btn period-btn'+(view.selector_id===currentSelectorId?' active':'');
    btn.textContent=view.label;
    if (view.publication_window_id) btn.title=view.publication_window_id;
    btn.onclick=()=>{ currentSelectorId=view.selector_id; currentChannel=''; currentAltitude=''; renderAll(); };
    container.appendChild(btn);
  });
}

function renderSelectors() {
  clearButtons(channelControls); clearButtons(altitudeControls);
  const data=currentView();
  if (!data) { channelControls.style.display='none'; altitudeControls.style.display='none'; return; }

  const channels=Object.keys(data.channels || {});
  if (!channels.length) { channelControls.style.display='none'; altitudeControls.style.display='none'; return; }
  channelControls.style.display='flex'; altitudeControls.style.display='flex';

  if (!channels.includes(currentChannel)) currentChannel=channels.find(channel=>channel.includes('532nm_AN')) || channels[0];
  channels.forEach(channel => {
    const btn=document.createElement('button');
    btn.className='tab-btn ch-btn'+(channel===currentChannel?' active':'');
    btn.textContent=channel.replace('_',' ');
    btn.onclick=()=>{ currentChannel=channel; currentAltitude=''; renderAll(); };
    channelControls.appendChild(btn);
  });

  const altitudes=Object.keys((data.channels || {})[currentChannel] || {}).sort((a,b)=>parseFloat(a)-parseFloat(b));
  if (!altitudes.includes(currentAltitude)) currentAltitude=altitudes.includes('15') ? '15' : (altitudes[0] || '');
  altitudes.forEach(altitude => {
    const btn=document.createElement('button');
    btn.className='tab-btn'+(altitude===currentAltitude?' active':'');
    btn.textContent=altitude+' km';
    btn.onclick=()=>{ currentAltitude=altitude; renderAll(); };
    altitudeControls.appendChild(btn);
  });
}

function updateDisplay() {
  const data=currentView(); hideMessage();
  if (!data) { showMessage('No data are available for this day.'); return; }

  let url='';
  url=(((data.channels || {})[currentChannel] || {})[currentAltitude]) || '';

  if (!url) { showMessage('No image is available for this view.'); return; }
  img.style.opacity='.4'; img.src=url;
}

function renderAll() { renderWindows(); renderSelectors(); updateDisplay(); }

img.onload=()=>{ img.style.opacity='1'; img.style.display='block'; message.classList.remove('active'); };
img.onerror=()=>{ img.style.opacity='1'; showMessage('Image not found or failed to load.'); };
const modal=document.getElementById('myModal'), modalImg=document.getElementById('img01');
function openModal(src) { if (!src || img.style.display==='none') return; modal.style.display='block'; modalImg.src=src; }
function closeModal() { modal.style.display='none'; modalImg.src=''; }
window.onclick=event=>{ if(event.target===modal) closeModal(); };
document.addEventListener('keydown',event=>{ if(event.key==='Escape') closeModal(); });
renderAll();
</script>
