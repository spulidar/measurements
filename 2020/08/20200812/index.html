<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SPU Lidar | 12 Aug 2020</title>
  <style>
    :root { --top:#1a1a1a; --page:#f0f2f5; --panel:#fff; --text:#333; --muted:#777; --blue:#0056b3; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--page); color:var(--text); font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    body { min-height:100vh; display:flex; flex-direction:column; }
    .top-bar { background:var(--top); color:white; padding:10px 24px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; box-shadow:0 2px 4px rgba(0,0,0,.2); }
    .top-bar h2 { margin:0; font-size:18px; font-weight:500; letter-spacing:1px; }
    .date { color:#4fc3f7; font-weight:700; }
    .metadata { color:#aaa; font:12px monospace; display:flex; gap:15px; flex-wrap:wrap; }
    .toolbar { position:sticky; top:0; z-index:10; background:var(--panel); border-bottom:1px solid #ddd; padding:8px 20px; display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:18px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .control-group { display:flex; align-items:center; justify-content:center; gap:7px; flex-wrap:wrap; }
    .control-group h3 { margin:0 4px 0 0; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:1px; }
    .main-mode-btn { border:0; border-bottom:3px solid transparent; background:transparent; padding:7px 10px; color:var(--muted); font-weight:650; cursor:pointer; }
    .main-mode-btn.active { color:var(--blue); border-bottom-color:var(--blue); }
    .tab-btn { border:1px solid #ccc; border-radius:4px; background:#f8f9fa; color:#555; padding:6px 10px; min-height:31px; font:600 12px monospace; cursor:pointer; }
    .tab-btn:hover { background:#e2e6ea; color:#111; }
    .tab-btn.active { background:#546e7a; border-color:#37474f; color:#fff; }
    .period-btn.active { background:var(--blue); border-color:#004085; }
    .ch-btn.active { background:#2e7d32; border-color:#1b5e20; }
    .image-container { padding:15px; text-align:center; min-height:calc(100vh - 150px); flex:1; display:flex; justify-content:center; align-items:center; }
    #main-display { max-width:100%; max-height:calc(100vh - 180px); object-fit:contain; background:#fff; box-shadow:0 6px 16px rgba(0,0,0,.15); cursor:zoom-in; }
    .message { display:none; max-width:720px; background:#fff; border:1px solid #ddd; border-radius:8px; padding:20px; line-height:1.5; box-shadow:0 4px 12px rgba(0,0,0,.08); }
    .message.active { display:block; }
    #myModal { display:none; position:fixed; z-index:1000; inset:0; background:rgba(0,0,0,.9); }
    .modal-close { position:absolute; top:15px; right:30px; color:#bbb; font-size:40px; cursor:pointer; }
    .modal-content { display:block; margin:2vh auto 0; max-width:98%; max-height:95vh; }
    @media (max-width:700px) {
      .top-bar { justify-content:center; text-align:center; padding:10px 12px; }
      .metadata { width:100%; justify-content:center; font-size:10px; }
      .toolbar { position:static; padding:10px 8px; gap:10px; }
      .control-group { width:100%; }
      .control-group h3 { width:100%; text-align:center; margin:3px 0; }
      .tab-btn { flex:1 1 74px; min-height:38px; }
      .image-container { align-items:flex-start; padding:10px 8px 18px; min-height:auto; }
      #main-display { width:100%; max-height:none; height:auto; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <h2>SPU LIDAR STATION | <span class="date">12 Aug 2020</span></h2>
    <div class="metadata"><span>LAT: 23.56°S</span><span>LON: 46.73°W</span><span>ELEV: 760m</span></div>
  </div>

  <div class="toolbar">
    <div class="control-group" id="period-controls"><h3>Publication window</h3></div>
    <div class="control-group">
      <button class="main-mode-btn active" id="tab-quicklooks">RCS Maps</button>
    </div>
    <div class="control-group" id="channel-controls"><h3>Wavelength</h3></div>
    <div class="control-group" id="altitude-controls"><h3>Range</h3></div>
  </div>

  <div class="image-container">
    <img id="main-display" alt="Lidar publication view" onclick="openModal(this.src)">
    <div id="message" class="message"></div>
  </div>

  <div id="myModal"><span class="modal-close" onclick="closeModal()">&times;</span><img class="modal-content" id="img01" alt="Expanded lidar image"></div>

<script>
const dayData = {"date": "20200812", "publication_views": [{"selector_id": "06", "publication_window_id": "20200812_spu_06", "label": "06–12", "channels": {"1064nm_AN": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_06_1064nm_AN_15km.webp?v=e30abae2d6d230c434764ae53e6fec58cc49e52d685ee2a4f2d4c20039f7979e", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_06_1064nm_AN_30km.webp?v=ec12c5fbed229e6fec1d4507b42ce868a945a51299345046143d8130c5f503f0", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_06_1064nm_AN_5km.webp?v=b16b3f93991d928f36ba5a20af669bd6bbf72a57cf8d5b29709996eef3ce6f80"}, "355nm_AN": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_06_355nm_AN_15km.webp?v=29c404fab503a1dd862b2008089f743b795834da55cef70e0552c8fbfd712ef1", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_06_355nm_AN_30km.webp?v=8ad76b5a98ba48f8fcee4889a3cbe07139fd056863b13b00b71dad778fe408d0", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_06_355nm_AN_5km.webp?v=493f8569199659a23be5784e8e0caa7c95d558cdf4d27a92729f79ada3a7fec7"}, "355nm_PC": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_06_355nm_PC_15km.webp?v=7b3b101e368fddf63a707b364e5ac347427b03352bbb25f4f3858afd66269a6f", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_06_355nm_PC_30km.webp?v=3ab1d4f2a610dd6c2d8a3ce687e1cecb43498d711c1155cef11954e530544987", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_06_355nm_PC_5km.webp?v=6f1547132139d9d8bc4850faa175dc39ecf042e379e5291dbfff65fcf330d65a"}, "532nm_AN": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_06_532nm_AN_15km.webp?v=5e3f6597c70a6e866fe49acde4cc0f2914758da9da9a1e7320258904bdf45176", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_06_532nm_AN_30km.webp?v=4b967de2d644d4130e6d6e27d463a4c23a1c317c1f78b5a022c765c9cf85a82e", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_06_532nm_AN_5km.webp?v=91244d0858286dec4a857defe016fa84c18887ac3892bcaaf775e6d8271c277c"}, "532nm_PC": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_06_532nm_PC_15km.webp?v=12dbeac117ac88a6e31f3ec48744d6b9fa4381d9e853ade0f1870c36195cc5ff", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_06_532nm_PC_30km.webp?v=9ea1555c1e9a8e18303cb6f076da09ca36a9c51ba362dba922cd746a8f5c1488", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_06_532nm_PC_5km.webp?v=0c166b71dd31d7453af4f2e50b7b4cd8c325e9bf43fbf195e4e88649f54a0959"}}}, {"selector_id": "12", "publication_window_id": "20200812_spu_12", "label": "12–18", "channels": {"1064nm_AN": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_12_1064nm_AN_15km.webp?v=2666a80ae9f8632bcdcb9369df68b043bf1ec1bc152a9a9f11148fdc4c0aede7", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_12_1064nm_AN_30km.webp?v=27af45d5e31b836e7efddee20dcfa199bd4e31ee213341b24bd521d114524529", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_12_1064nm_AN_5km.webp?v=d88c476f858fbef5439293e7f115c675593cf2fed76862f7ee6f8951deebdfa5"}, "355nm_AN": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_12_355nm_AN_15km.webp?v=b57ee79743297a8f09a7a870c8ebd9115509c7896a9da5c23ca86ae8aab8d227", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_12_355nm_AN_30km.webp?v=5984c945462181eb8f982c964d8680517bde5c282483930a830a6840834909df", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_12_355nm_AN_5km.webp?v=03cab1c1e3de82de0cc9ca6202d23ce6043dd3d9fbc498dc12bb34e299ef84eb"}, "355nm_PC": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_12_355nm_PC_15km.webp?v=9cb0252c3765dc30173d624f55e4e7d5a9f6d1df96d9fbe4524491c28df437d3", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_12_355nm_PC_30km.webp?v=20cd088c08752395a528506939945ebc6a1447db95debf511da9a89a22503624", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_12_355nm_PC_5km.webp?v=89f9bddee91ca764b9f58349a3f242eb1fcac9b7a30f2fc3348bd45e8b9424c2"}, "532nm_AN": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_12_532nm_AN_15km.webp?v=79e0334de734b5391e008045ff17f995fe126b45e598a412a805be4e36f645c3", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_12_532nm_AN_30km.webp?v=08168e413f06615690a46c305a0a94ffae5ce2bdae21a33d7296361e8f8236f3", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_12_532nm_AN_5km.webp?v=2a070c50e55498795251d3244a814a3e314c92f3e5e55b99f045047ee39fb598"}, "532nm_PC": {"15": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_12_532nm_PC_15km.webp?v=100cd5e7bbebd0ebeeaacb9686618887bce4cd22fd3284ac3bba1fd6e62209fa", "30": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_12_532nm_PC_30km.webp?v=cdbeaca3fbb41061d2adb3e6adb07479d008ce882bdc3afef1c4a16ede1cde5e", "5": "https://pub-2dc2005030bb4ee796dd63fd528879fa.r2.dev/spu/2020/08/20200812/rcs_20200812_spu_12_532nm_PC_5km.webp?v=310c7ae62eb799dc930f6ca6786286270703a1126d1c06519ad0d8b32f9b217e"}}}]};
let currentSelectorId = dayData.publication_views.length ? dayData.publication_views[0].selector_id : '';
let currentChannel = '';
let currentAltitude = '';

const img = document.getElementById('main-display');
const message = document.getElementById('message');
const channelControls = document.getElementById('channel-controls');
const altitudeControls = document.getElementById('altitude-controls');

function clearButtons(container) { container.querySelectorAll('button').forEach(button => button.remove()); }
function currentView() { return dayData.publication_views.find(view => view.selector_id === currentSelectorId) || null; }
function showMessage(text) { img.style.display='none'; message.textContent=text; message.classList.add('active'); }
function hideMessage() { message.classList.remove('active'); message.textContent=''; img.style.display='block'; }

function renderWindows() {
  const container=document.getElementById('period-controls');
  clearButtons(container);
  dayData.publication_views.forEach(view => {
    const btn=document.createElement('button');
    btn.className='tab-btn period-btn'+(view.selector_id===currentSelectorId?' active':'');
    btn.textContent=view.label;
    if (view.publication_window_id) btn.title=view.publication_window_id;
    btn.onclick=()=>{ currentSelectorId=view.selector_id; currentChannel=''; currentAltitude=''; renderAll(); };
    container.appendChild(btn);
  });
}

function renderSelectors() {
  clearButtons(channelControls); clearButtons(altitudeControls);
  const data=currentView();
  if (!data) { channelControls.style.display='none'; altitudeControls.style.display='none'; return; }

  const channels=Object.keys(data.channels || {});
  if (!channels.length) { channelControls.style.display='none'; altitudeControls.style.display='none'; return; }
  channelControls.style.display='flex'; altitudeControls.style.display='flex';

  if (!channels.includes(currentChannel)) currentChannel=channels.find(channel=>channel.includes('532nm_AN')) || channels[0];
  channels.forEach(channel => {
    const btn=document.createElement('button');
    btn.className='tab-btn ch-btn'+(channel===currentChannel?' active':'');
    btn.textContent=channel.replace('_',' ');
    btn.onclick=()=>{ currentChannel=channel; currentAltitude=''; renderAll(); };
    channelControls.appendChild(btn);
  });

  const altitudes=Object.keys((data.channels || {})[currentChannel] || {}).sort((a,b)=>parseFloat(a)-parseFloat(b));
  if (!altitudes.includes(currentAltitude)) currentAltitude=altitudes.includes('15') ? '15' : (altitudes[0] || '');
  altitudes.forEach(altitude => {
    const btn=document.createElement('button');
    btn.className='tab-btn'+(altitude===currentAltitude?' active':'');
    btn.textContent=altitude+' km';
    btn.onclick=()=>{ currentAltitude=altitude; renderAll(); };
    altitudeControls.appendChild(btn);
  });
}

function updateDisplay() {
  const data=currentView(); hideMessage();
  if (!data) { showMessage('No data are available for this day.'); return; }

  let url='';
  url=(((data.channels || {})[currentChannel] || {})[currentAltitude]) || '';

  if (!url) { showMessage('No image is available for this view.'); return; }
  img.style.opacity='.4'; img.src=url;
}

function renderAll() { renderWindows(); renderSelectors(); updateDisplay(); }

img.onload=()=>{ img.style.opacity='1'; img.style.display='block'; message.classList.remove('active'); };
img.onerror=()=>{ img.style.opacity='1'; showMessage('Image not found or failed to load.'); };
const modal=document.getElementById('myModal'), modalImg=document.getElementById('img01');
function openModal(src) { if (!src || img.style.display==='none') return; modal.style.display='block'; modalImg.src=src; }
function closeModal() { modal.style.display='none'; modalImg.src=''; }
window.onclick=event=>{ if(event.target===modal) closeModal(); };
document.addEventListener('keydown',event=>{ if(event.key==='Escape') closeModal(); });
renderAll();
</script>

</html>
