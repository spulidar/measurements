<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPU Lidar Station Measurements</title>
  <link rel="stylesheet" href="https://unpkg.com/js-year-calendar@latest/dist/js-year-calendar.min.css">
  <script src="https://unpkg.com/js-year-calendar@latest/dist/js-year-calendar.min.js"></script>
  <style>
    body { font-family:'Segoe UI',Roboto,Helvetica,sans-serif; color:#333; margin:0; padding:10px; background:transparent; }
    .calendar { background:#fff; border-radius:4px; border:1px solid #ddd; overflow:hidden; }
    .calendar-header * { transition:none !important; animation:none !important; }
    .legend { display:flex; flex-wrap:wrap; gap:7px 12px; align-items:center; justify-content:center; margin:0 0 10px; color:#666; font-size:11px; }
    .legend strong { color:#444; }
    .legend-item { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
    .legend-dot, .coverage-dot { width:7px; height:7px; border-radius:50%; background:#d9dee3; display:inline-block; }
    .legend-dot { background:#4f9f8f; }
    .coverage-strip { position:absolute; left:50%; bottom:3px; transform:translateX(-50%); display:flex; gap:2px; pointer-events:none; }
    .coverage-dot.available { background:#4f9f8f; }
    .day { position:relative; }
    .popover-menu { position:absolute; display:none; background:#fff; padding:8px 10px; border-radius:12px; box-shadow:0 4px 18px rgba(0,0,0,.22); border:1px solid #ddd; z-index:1000; flex-direction:column; gap:6px; min-width:180px; }
    .popover-title { color:#777; font-size:10px; text-transform:uppercase; letter-spacing:.8px; padding:0 3px 2px; }
    .period-link { border:1px solid #ccd2d8; background:#f7f8fa; color:#333; border-radius:5px; padding:7px 10px; text-align:left; cursor:pointer; font:600 12px monospace; }
    .period-link:hover { background:#0056b3; border-color:#004085; color:#fff; }
    .loading, .error { padding:18px; text-align:center; color:#777; }
    .error { color:#9a2f2f; }
    @media (max-width:600px) {
      body { padding:4px; }
      .legend { gap:5px 8px; font-size:9px; }
      .coverage-dot, .legend-dot { width:6px; height:6px; }
      .popover-menu { position:fixed; left:12px !important; right:12px; top:auto !important; bottom:12px; min-width:0; }
      .period-link { min-height:42px; }
    }
  </style>
</head>
<body>
  <div class="legend">
    <strong>Six-hour coverage:</strong>
    <span class="legend-item"><i class="legend-dot"></i>00–06</span>
    <span class="legend-item"><i class="legend-dot"></i>06–12</span>
    <span class="legend-item"><i class="legend-dot"></i>12–18</span>
    <span class="legend-item"><i class="legend-dot"></i>18–24</span>
  </div>
  <div id="status" class="loading">Loading measurement catalog…</div>
  <div id="calendar" style="display:none"></div>
  <div id="mini-popover" class="popover-menu"></div>

<script>
const siteBaseUrl = 'https://spulidar.github.io/measurements/';
const periodOrder = ['00','06','12','18'];
let manifest = null;

function parseDateKey(key) {
  return new Date(Number(key.slice(0,4)), Number(key.slice(4,6))-1, Number(key.slice(6,8)));
}
function dayKey(date) {
  return String(date.getFullYear()).padStart(4,'0') + String(date.getMonth()+1).padStart(2,'0') + String(date.getDate()).padStart(2,'0');
}
function tooltipFor(key, day) {
  const labels = manifest.period_labels;
  const lines = [key.slice(6,8)+'/'+key.slice(4,6)+'/'+key.slice(0,4)];
  periodOrder.forEach(p => lines.push(labels[p] + ': ' + (day.coverage[p] ? 'available' : 'no data')));
  const usesLegacy = Object.values(day.slots || {}).some(item => item.source && item.source !== 'canonical');
  if (usesLegacy) lines.push('Legacy products are retained until historical reprocessing.');
  return lines.join('\n');
}
function closePopover() {
  const popover=document.getElementById('mini-popover');
  popover.style.display='none'; popover.innerHTML='';
}
function showLegacyPopover(element, key, day) {
  const popover=document.getElementById('mini-popover');
  popover.innerHTML='';
  const title=document.createElement('div');
  title.className='popover-title'; title.textContent=key.slice(6,8)+'/'+key.slice(4,6)+'/'+key.slice(0,4)+' · legacy';
  popover.appendChild(title);
  (day.legacy_options || []).forEach(option => {
    const btn=document.createElement('button');
    btn.className='period-link'; btn.textContent=option.label;
    btn.onclick=function(ev){ ev.stopPropagation(); window.open(siteBaseUrl+option.url, '_blank'); closePopover(); };
    popover.appendChild(btn);
  });
  popover.style.display='flex';
  const rect=element.getBoundingClientRect();
  const top=rect.top+window.scrollY-popover.offsetHeight-10;
  const left=rect.left+window.scrollX+(rect.width/2)-(popover.offsetWidth/2);
  popover.style.top=Math.max(6,top)+'px';
  popover.style.left=Math.max(6,left)+'px';
}

function createCalendar(data) {
  manifest=data;
  const dayEntries=Object.entries(data.days || {});
  const source=dayEntries.map(([key,day]) => ({ startDate:parseDateKey(key), endDate:parseDateKey(key), color:'#A3E4D7', dateKey:key, day:day }));
  const years=dayEntries.map(([key])=>Number(key.slice(0,4)));
  const minYear=years.length ? Math.min(...years) : 2010;
  const maxYear=Math.max(new Date().getFullYear(), years.length ? Math.max(...years) : new Date().getFullYear());

  document.getElementById('status').style.display='none';
  document.getElementById('calendar').style.display='block';

  new Calendar('#calendar', {
    minDate:new Date(minYear,0,1),
    maxDate:new Date(maxYear,11,31),
    style:'background',
    dataSource:source,
    customDayRenderer:function(element,date){
      const key=dayKey(date), day=data.days[key];
      element.querySelectorAll('.coverage-strip').forEach(node=>node.remove());
      if (!day) {
        element.style.color='#d3d3d3'; element.style.cursor='default'; element.removeAttribute('title'); return;
      }
      element.style.position='relative'; element.style.cursor='pointer'; element.style.fontWeight='bold'; element.style.color='#333';
      element.title=tooltipFor(key,day);
      const strip=document.createElement('span'); strip.className='coverage-strip';
      periodOrder.forEach(p=>{ const dot=document.createElement('i'); dot.className='coverage-dot'+(day.coverage[p]?' available':''); strip.appendChild(dot); });
      element.appendChild(strip);
    },
    clickDay:function(e){
      if (!e.events.length) { closePopover(); return; }
      const event=e.events[0], day=event.day;
      if (day.day_url) { closePopover(); window.open(siteBaseUrl+day.day_url, '_blank'); return; }
      if ((day.legacy_options || []).length) { showLegacyPopover(e.element,event.dateKey,day); }
    }
  });
}

fetch('measurements.json', {cache:'no-cache'})
  .then(response => { if (!response.ok) throw new Error('HTTP '+response.status); return response.json(); })
  .then(createCalendar)
  .catch(error => {
    const status=document.getElementById('status'); status.className='error'; status.textContent='Could not load measurement catalog: '+error.message;
  });

document.addEventListener('click', event => {
  const popover=document.getElementById('mini-popover');
  if (popover.style.display==='flex' && !event.target.closest('.day') && !event.target.closest('#mini-popover')) closePopover();
});
</script>
</body>
</html>
