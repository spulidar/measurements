<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPU Lidar Station Measurements</title>
  <link rel="stylesheet" href="https://unpkg.com/js-year-calendar@latest/dist/js-year-calendar.min.css">
  <script src="https://unpkg.com/js-year-calendar@latest/dist/js-year-calendar.min.js"></script>
  <style>
    body { font-family:'Segoe UI',Roboto,Helvetica,sans-serif; color:#333; margin:0; padding:10px; background:transparent; }
    .calendar { background:#fff; border-radius:4px; border:1px solid #ddd; overflow:hidden; }
    .calendar-header * { transition:none !important; animation:none !important; }
    .legend { display:flex; align-items:center; justify-content:center; gap:6px; margin:0 0 10px; color:#666; font-size:11px; }
    .legend-swatch { width:9px; height:9px; border-radius:2px; display:inline-block; background:#A3E4D7; border:1px solid #79cdbd; }
    .day { position:relative; }
    .loading,.error { padding:18px; text-align:center; color:#777; }
    .error { color:#9a2f2f; }
    @media (max-width:600px) {
      body { padding:4px; }
      .legend { font-size:9px; }
      .legend-swatch { width:8px; height:8px; }
    }
  </style>
</head>
<body>
  <div class="legend"><i class="legend-swatch"></i><span>Measurement available</span></div>
  <div id="status" class="loading">Loading measurement catalog…</div>
  <div id="calendar" style="display:none"></div>

<script>
const siteBaseUrl='https://spulidar.github.io/measurements/';
const periodOrder=['00','06','12','18'];
let manifest=null;

function parseDateKey(key){return new Date(Number(key.slice(0,4)),Number(key.slice(4,6))-1,Number(key.slice(6,8)));}
function dayKey(date){return String(date.getFullYear()).padStart(4,'0')+String(date.getMonth()+1).padStart(2,'0')+String(date.getDate()).padStart(2,'0');}
function tooltipFor(key,day){
  const labels=manifest.period_labels;
  const lines=[key.slice(6,8)+'/'+key.slice(4,6)+'/'+key.slice(0,4)];
  periodOrder.forEach(period=>{
    const slot=(day.slots||{})[period];
    lines.push(labels[period]+': '+(slot&&slot.available?'data':'no data'));
  });
  return lines.join('\n');
}

function createCalendar(data){
  manifest=data;
  const dayEntries=Object.entries(data.days||{});
  const source=dayEntries.map(([key,day])=>({startDate:parseDateKey(key),endDate:parseDateKey(key),color:'#A3E4D7',dateKey:key,day:day}));
  const years=dayEntries.map(([key])=>Number(key.slice(0,4)));
  const minYear=years.length?Math.min(...years):2010;
  const maxYear=Math.max(new Date().getFullYear(),years.length?Math.max(...years):new Date().getFullYear());

  document.getElementById('status').style.display='none';
  document.getElementById('calendar').style.display='block';

  new Calendar('#calendar',{
    minDate:new Date(minYear,0,1),
    maxDate:new Date(maxYear,11,31),
    style:'background',
    dataSource:source,
    customDayRenderer:function(element,date){
      const key=dayKey(date),day=data.days[key];
      if(!day){element.style.color='#d3d3d3';element.style.cursor='default';element.removeAttribute('title');return;}
      element.style.cursor='pointer';element.style.fontWeight='bold';element.style.color='#333';element.title=tooltipFor(key,day);
    },
    clickDay:function(e){
      if(!e.events.length)return;
      const day=e.events[0].day;
      if(day.day_url)window.open(siteBaseUrl+day.day_url,'_blank');
    }
  });
}

fetch('measurements.json',{cache:'no-cache'})
  .then(response=>{if(!response.ok)throw new Error('HTTP '+response.status);return response.json();})
  .then(createCalendar)
  .catch(error=>{const status=document.getElementById('status');status.className='error';status.textContent='Could not load measurement catalog: '+error.message;});
</script>
</body>
</html>
