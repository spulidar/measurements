name: Publication v2 safe checks

on:
  push:
    branches: [publication-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout publication branch (read only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout MILGRAU scientific core
        uses: actions/checkout@v4
        with:
          repository: spulidar/milgrau
          ref: main
          path: milgrau
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: milgrau/pyproject.toml
      - name: Install shared environment and optional publisher
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./milgrau[dev,explorer,web]"
          python -m pip install -e .
          python -c "import boto3, xarray, milgrau; from publisher.cli import main; print('core + publisher OK')"
          milgrau-publish --help
          milgrau-publish status --help
          milgrau-publish remove --help
          milgrau-publish cache --help
      - name: Static syntax
        run: |
          python -m compileall -q publisher tests
          node --check publisher/preview_assets/app.js
      - name: Unit, integration and synthetic Level 1 tests
        run: python -m pytest -q tests
      - name: Execute real console dry-run without credentials or L1
        run: |
          cp milgrau/config.yaml ../config.yaml
          cp milgrau/station.yaml ../station.yaml
          milgrau-publish --dry-run
          milgrau-publish status
      - name: Validate calendar matches committed publication history (no cloud writes)
        run: |
          python - <<'PY'
          from pathlib import Path
          from publisher.site_v2 import build_unchanged_frontend
          from publisher.published import load_published_states
          from publisher.history import load_controls
          repo = Path.cwd()
          states = load_published_states(repo, "spu")
          controls = load_controls(repo, "spu")
          blocked = set(controls["hidden"]) | set(controls["removed"])
          expected_days = {date for year in states.values() for date in year["days"] if date not in blocked}
          root, days = build_unchanged_frontend(
              repo, repo / ".cache/measurements", "spu",
              r2_public_base="https://staging.example.invalid",
          )
          assert days == len(expected_days), (days, len(expected_days))
          assert (root / "ql-measurement-calendar.html").is_file()
          assert (root / "measurements.json").is_file()
          for date in expected_days:
              assert (root / date[:4] / date[4:6] / date / "index.html").is_file()
          PY
